name: flutter_application
description: MedSync Medicine Reminder App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  cloud_functions: ^5.0.1

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  http: ^1.2.1
  firebase_messaging: ^15.0.0
  workmanager: ^0.6.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Location
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_background_service: ^5.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.68.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Storage
  shared_preferences: ^2.2.3

  # Image Picker
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

  assets:
    - assets/caduceus-symbol.png
    - assets/medicine.png
    - assets/tablet.png
    - assets/capsule.png
    - assets/drops.png
    - assets/syrup.png
    - assets/powder.png
    - assets/injection.png
    - assets/ointment.png
    - assets/inhaler.png


flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.png"